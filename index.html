<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 가이드</title>
<style>
:root{--bg:#eef1f0;--surface:#fff;--ink:#16201f;--muted:#5b6866;--line:#d5dcda;--accent:#1f5d57}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1514;--surface:#18201f;--ink:#e6ecea;--muted:#9aa8a5;--line:#2a3533;--accent:#7cc4ba}}
:root[data-theme="dark"]{--bg:#0f1514;--surface:#18201f;--ink:#e6ecea;--muted:#9aa8a5;--line:#2a3533;--accent:#7cc4ba}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font-size:26px;margin:0 0 4px} p{color:var(--muted);margin:0 0 24px}
a.trip{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;color:inherit;text-decoration:none}
a.trip b{display:block;font-size:18px} a.trip span{color:var(--muted);font-size:14px}
a.trip::after{content:"→";float:right;color:var(--accent);margin-top:-36px}
</style>
</head>
<body>
<main>
<h1>여행 가이드</h1>
<p>폰으로 열어서 현지에서 보는 일정별 가이드예요.</p>
<!-- 새 여행을 추가하면 여기에 한 줄 -->
<a class="trip" href="chongqing-2026/"><b>충칭 3박 4일</b><span>2026.11.28 – 12.01 · 3인</span></a>
</main>
</body>
</html>
