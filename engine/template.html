<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f0">
<title>{{title}}</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{short_name}}">
<style>
/* Layout: 한 손 엄지 스크롤용 단일 컬럼. 일차 목록(카드 + 이동 연결선) → 장소 상세(타입별 9개 목차) */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#16201f; --muted:#5b6866; --line:#d5dcda;
  --river:#1f5d57; --river-soft:#dcebe8;      /* 명소 · 자링강 녹청 */
  --gold:#8a6410; --gold-soft:#f5ead2;        /* 가게 · 등롱 금색 */
  --chili:#b3261e; --chili-soft:#f8e3e0;      /* 주의 · 고추기름 */
  --f-display:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514;--surface:#18201f;--ink:#e6ecea;--muted:#9aa8a5;--line:#2a3533;
  --river:#6fc0b5;--river-soft:#1c3330;--gold:#e2b75a;--gold-soft:#332a17;--chili:#ff8a7e;--chili-soft:#3a1f1c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#18201f;--ink:#e6ecea;--muted:#9aa8a5;--line:#2a3533;
  --river:#6fc0b5;--river-soft:#1c3330;--gold:#e2b75a;--gold-soft:#332a17;--chili:#ff8a7e;--chili-soft:#3a1f1c;color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--river);outline-offset:2px}
img{max-width:100%;display:block}

/* 표지 */
.cover{position:relative;color:#fff;background:#0b1211}
.cover img{width:100%;height:260px;object-fit:cover;opacity:.72}
.cover .wrap{position:absolute;inset:auto 0 0 0;padding-block:0 18px}
.cover .eyebrow{font:600 13px/1 var(--f-body);opacity:.9}
.cover h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.15;margin:8px 0 4px;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cover p{margin:0;font-size:13px;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.credit{font-size:10px;opacity:.7}

/* 탭 */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;line-height:1.2;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
nav.tabs button small{font:500 11px/1.2 var(--f-mono);color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--river);border-color:var(--river);color:var(--bg)}
nav.tabs button[aria-selected="true"] small{color:var(--bg);opacity:.8}

main{padding-block:16px 48px}
.daylead{margin:4px 0 16px}
.daylead h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.3;text-wrap:balance}
.daylead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}

/* 장소 카드 */
.card{display:grid;grid-template-columns:64px 1fr 16px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;position:relative;z-index:1}
.card:active{transform:scale(.99)}
.card.spot{border-left:4px solid var(--river)}
.card.shop{border-left:4px solid var(--gold)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--river-soft)}
.glyph{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 28px var(--f-display)}
.spot .glyph{background:var(--river-soft);color:var(--river)}
.shop .glyph{background:var(--gold-soft);color:var(--gold)}
.cbody{min-width:0}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.time{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{margin:4px 0 2px;font-size:17px;line-height:1.3}
.card .one{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.chev{color:var(--muted);font-size:18px}
.tchip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tchip.spot{background:var(--river-soft);color:var(--river)}
.tchip.shop{background:var(--gold-soft);color:var(--gold)}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.b-ok{background:var(--river-soft);color:var(--river)} .b-pay{background:var(--gold-soft);color:var(--gold)}
.b-wait{background:var(--chili-soft);color:var(--chili)} .b-walk{color:var(--muted);border:1px solid var(--line)}

/* 이동 연결선 */
.move{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:6px 10px 6px 14px;position:relative;min-height:58px}
.move::before{content:"";position:absolute;left:46px;top:0;bottom:0;border-left:2px dotted var(--muted);opacity:.6}
.mico{width:36px;height:36px;margin-left:15px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.mtxt{font-size:13px;line-height:1.4}
.mtxt b{font-size:14px}
.mtxt .cost{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.mtxt small{display:block;color:var(--muted)}
.minor{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:4px 10px;position:relative;z-index:1}
.minor .dot{width:14px;height:14px;margin-left:25px;border-radius:50%;background:var(--muted)}
.minor div{font-size:14px} .minor .time{margin-right:6px}
.minor small{color:var(--muted)}
.branch{margin:6px 0;font-size:13px;color:var(--gold);background:var(--gold-soft);border-radius:10px;padding:8px 12px;position:relative;z-index:1}
.branch b{display:block}

/* 상세 */
.back{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.back .wrap{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.back button{background:none;border:0;cursor:pointer;font-weight:500;min-height:44px;padding:0;color:var(--river)}
.back span{font-size:12px;color:var(--muted)}
.dhero{margin:0}
.dhero img{width:100%;aspect-ratio:16/10;object-fit:cover}
.dhero figcaption{font-size:10px;color:var(--muted);padding:4px 0 0}
.dhead{padding-block:14px 4px}
.dhead h2{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:6px 0 4px;text-wrap:balance}
.dhead .one{margin:0 0 8px;color:var(--muted)}
/* 중국어 이름 복사 버튼 — 목록 카드·상세 머리·메뉴 행에서 같이 씀 */
.cc{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--river-soft);color:var(--river);border:1px solid transparent;border-radius:9px;padding:6px 9px;min-height:38px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:background .12s,color .12s}
.cc .zht{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.3;word-break:break-all}
.cc .ccl{flex:0 0 auto;font:500 10px/1 var(--f-body);opacity:.75;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.cc .ccl::before{content:"⧉";font-size:12px;line-height:1}
.cc:active{transform:scale(.985)}
.cc.copied{background:var(--river);border-color:var(--river);color:var(--bg)}
.cc.copied .ccl{opacity:1}
.cc.big{min-height:44px;padding:8px 11px}
.cc.big .zht{font-size:15px}
.cnrow{display:flex;align-items:center;gap:8px;margin:-2px 0 6px 12px;padding-right:8px}
.cnrow .cnlab{flex:0 0 auto;font:500 10px/1 var(--f-mono);color:var(--muted)}
.cnrow .cc{flex:0 1 auto;min-width:0}
.cn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cn a{font-size:13px;font-weight:500;color:var(--river);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;padding:0 4px}
.cc.copied .ccl::before{content:"✓"}
/* 한글 발음 + 듣기 버튼 (annotateZh 가 붙임) */
.cc .zh{display:block}
.cc .yin{display:block;font:500 11px/1.3 var(--f-body);opacity:.78;margin-top:2px;word-break:keep-all}
.cc.copied .yin{opacity:1}
.say{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--river);cursor:pointer;-webkit-tap-highlight-color:transparent}
.say svg{width:18px;height:18px;display:block}
.say.on{background:var(--river);border-color:var(--river);color:var(--bg)}
.zhq{font:inherit;color:var(--river);background:none;border:0;border-bottom:1px dotted currentColor;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.zhq svg{width:.95em;height:.95em;vertical-align:-.1em;margin-left:2px}
.zhq.on{background:var(--river-soft)}
.yinq{font-size:.86em;color:var(--muted);margin:0 2px 0 3px;word-break:keep-all}
.toc{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc button{flex:0 0 auto;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;cursor:pointer;min-height:34px}
.toc button b{display:none}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;scroll-margin-top:64px}
.dsec h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.dsec h3 b{display:none}
.dsec ul{margin:0;padding-left:18px} .dsec li{margin:3px 0}
.dsec p{margin:0}
.dsec.warn{background:var(--chili-soft);border-color:transparent} .dsec.warn h3{color:var(--chili)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.stories{display:grid;gap:8px}
.story{background:var(--bg);border-left:3px solid var(--river);border-radius:0 10px 10px 0;padding:8px 12px}
.story b{font-size:14px} .story p{margin:3px 0 0;font-size:14px;line-height:1.55}
.pc{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.pc div{border-radius:10px;padding:8px 12px;font-size:14px}
.pc .pro{background:var(--river-soft)} .pc .con{background:var(--bg)}
.pc b{font-size:12px}
.dish{padding:10px 0;border-bottom:1px dashed var(--line)}
.dish:first-child{padding-top:0} .dish:last-child{border-bottom:0;padding-bottom:0}
.dish-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dish-h b{font-size:15px}
.price{font:500 12px var(--f-mono);color:var(--gold);white-space:nowrap}
.dish-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.dish-m .cc{padding:4px 8px;min-height:34px}
.dish-m .cc .zht{font-size:13px}
.spice{font-size:12px;letter-spacing:1px}
.spice .off{opacity:.2}
.spice em{font-style:normal;color:var(--muted);letter-spacing:0;margin-left:2px}
.dish p{margin:0;font-size:14px}
.order li{font-weight:500}
.total{margin-top:8px;font:500 14px var(--f-mono);color:var(--gold)}
.note{margin-top:4px;font-size:13px;color:var(--muted)}
.src a{color:var(--river);font-size:14px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;min-height:56px;font-size:13px}
.pager button span{display:block;font-size:11px;color:var(--muted)}
.pager .next{text-align:right}

/* 공통 탭 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel ul{margin:0;padding-left:18px} .panel li{margin:3px 0}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.phrase:first-child{border-top:0;margin-top:0;padding-top:0}
.phrase .zhb{font-family:var(--f-display);font-size:20px;font-weight:600}
.phrase .ko{font-size:13px;color:var(--muted)}
.phrase .say{padding:0;min-height:0;width:40px;height:40px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--river)}
.phrase .say.on{background:var(--river);border-color:var(--river);color:var(--bg)}
.talkhint{font-size:12px;color:var(--muted);margin:0 0 10px}
.phrase .pt{min-width:0;display:flex;flex-direction:column;gap:2px}
.phrase .yin{font-size:13px;font-weight:600;color:var(--river)}
.phrase .pb{display:flex;gap:6px;align-items:center}
.phrase button{grid-row:1/3;grid-column:2;font-weight:600;font-size:13px;color:var(--river);background:var(--river-soft);border:0;border-radius:8px;padding:8px 10px;min-height:40px;cursor:pointer}
.msteps{margin-top:6px}
.msteps summary{cursor:pointer;color:var(--river);font-weight:600;font-size:13px;min-height:32px;display:flex;align-items:center}
.msteps ol{margin:4px 0 6px;padding-left:20px;font-size:13px} .msteps li{margin:4px 0}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--river);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline}
.aclinks{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0}
.aclinks .linkbtn{min-height:44px;display:inline-flex;align-items:center}
.stepper{list-style:none;margin:8px 0 0;padding:0;counter-reset:st}
.stepper li{display:grid;grid-template-columns:40px 1fr;gap:10px;position:relative;padding-bottom:14px}
.stepper li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;border-left:2px dotted var(--muted);opacity:.6}
.stepper .sico{width:40px;height:40px;border-radius:50%;background:var(--river-soft);display:flex;align-items:center;justify-content:center;font-size:19px}
.stepper li>div>b{display:block;font-size:15px} .stepper span{font-size:13px;color:var(--muted)}
.prep{counter-reset:pr;list-style:none;padding:0;margin:6px 0 0}
.prep li{counter-increment:pr;position:relative;padding-left:30px;margin:8px 0;font-size:14px}
.prep li::before{content:counter(pr);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--river);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prep li span{display:block;font-size:13px;color:var(--muted)}
.muted-s{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.panel h4{margin:14px 0 4px;font-size:15px}
.warnlist li::marker{color:var(--chili)}
.callout{border-left:3px solid var(--chili);padding:6px 0 6px 12px;margin:0 0 14px;font-size:14px}
/* 이야기 탭 (충칭 역사·상식) */
.storysec{scroll-margin-top:64px}
.storysec h3{font-family:var(--f-display);font-size:19px;line-height:1.35}
.storysec h3 b{display:none}
.storysec p{margin:0 0 10px;font-size:15px;line-height:1.68}
.storysec p:last-child{margin:0}
.storysec em{font-style:normal;color:var(--river);font-weight:700}
.storysec ul{margin:0;padding-left:18px}
.storysec ul+p{margin-top:10px}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px;line-height:1.55}
.tl li:first-child{border-top:0;padding-top:0}
.tl b{font:500 12px/1.6 var(--f-mono);color:var(--river);letter-spacing:-.01em}
.fact{background:var(--bg);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14px;line-height:1.6;margin:10px 0 0}
.fact b{color:var(--gold)}
/* 입국카드 탭 — 복사해서 그대로 붙여넣는 칸 */
.acf{display:grid;gap:4px;padding:9px 0;border-top:1px dashed var(--line)}
.acf:first-of-type{border-top:0;padding-top:0}
.acf-l{font:500 10px/1.3 var(--f-mono);color:var(--muted)}
.acf .cc{width:100%;justify-content:space-between;text-align:left}
.acf .cc .zht{white-space:normal}
.cc.lat .zht{font-family:var(--f-body);font-weight:500;font-size:13.5px;letter-spacing:0}
.acgo{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:9px 13px;margin:8px 6px 0 0;border-radius:10px;background:var(--river);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px}
.acgo.ghost{background:var(--surface);color:var(--river);border:1px solid var(--line)}
.acnote{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.55}
/* 기념품·쇼핑 탭 — 대상별 태그로 거르는 카드 */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;line-height:1.2;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--river);border-color:var(--river);color:var(--bg)}
.gift{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.gtop{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.gtop h4{margin:0;font-size:16px;line-height:1.35}
.gprice{font:500 12px/1.4 var(--f-mono);color:var(--gold);text-align:right}
.gprice span{display:block;color:var(--muted);font-size:11px;font-weight:400}
.gtags{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}
.gtag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--river-soft);color:var(--river)}
.gtag.friend{background:var(--gold-soft);color:var(--gold)}
.gtag.family{background:var(--chili-soft);color:var(--chili)}
.gift .dish-m{margin:8px 0 4px}
.gift p{margin:2px 0 0;font-size:13.5px;line-height:1.58}
.gmeta{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.gmeta b{color:var(--ink);font-weight:600}
.gwarn{color:var(--chili);font-weight:700}
.store{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.store h4{margin:0;font-size:15.5px;line-height:1.4}
.store .sk{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.store .addr{font-size:12.5px;color:var(--muted);margin:3px 0 4px;line-height:1.55}
.store p{margin:5px 0 0;font-size:13.5px;line-height:1.58}
/* 카페·가게 탭 — 구역·성격 두 줄 필터 + 사진 가로 스크롤 카드 */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;margin-bottom:12px;scroll-margin-top:64px}
.cg{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -4px 8px;padding:2px 4px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cg::-webkit-scrollbar{display:none}
.cg figure{flex:0 0 82%;margin:0;scroll-snap-align:start;min-width:0}
.cg img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--gold-soft)}
.cg figcaption{font-size:11px;line-height:1.35;color:var(--muted);padding:4px 2px 0}
.cg .swipe{flex:0 0 auto;align-self:center;font:500 10px/1.3 var(--f-mono);color:var(--muted);padding:0 2px 18px;white-space:nowrap}
.chead{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.carea{font-size:11px;font-weight:700;color:var(--river);background:var(--river-soft);border-radius:6px;padding:2px 7px}
.ccard h4{margin:3px 0 4px;font-size:17px;line-height:1.35}
.ccard .one{margin:5px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.ccard .cn{margin-top:7px}
.ckv{display:grid;grid-template-columns:44px 1fr;gap:4px 8px;font-size:13px;line-height:1.5;margin:9px 0 0}
.ckv dt{color:var(--muted);font-weight:500}
.ckv dd{margin:0;min-width:0}
.ckv dd span{color:var(--muted)}
.cmenu{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 0}
.cmenu span{font-size:12px;line-height:1.3;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.cmenu b{font:500 11px var(--f-mono);color:var(--gold);margin-left:2px}
.ctip{margin:10px 0 0;font-size:13px;line-height:1.55;background:var(--gold-soft);border-radius:10px;padding:8px 10px}
.ctip b{display:block;font-size:10px;color:var(--gold);margin-bottom:2px}
.clinks{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:4px}
.clinks a{font-size:13px;font-weight:600;color:var(--river);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.csrc{margin-top:2px;font-size:12px;color:var(--muted)}
.csrc summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.csrc ul{margin:2px 0 0;padding-left:16px}
.csrc a{color:var(--river)}
.gtag.cafe{background:var(--river-soft);color:var(--river)}
.gtag.dessert{background:var(--gold-soft);color:var(--gold)}
.gtag.snack{background:var(--chili-soft);color:var(--chili)}
.gtag.shop{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:20;max-width:calc(100% - 40px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;line-height:1.3;padding:9px 15px;border-radius:999px;text-align:center;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.offline{font-size:12px;color:var(--muted);margin:8px 0 0}
.offline b{color:var(--river)}
.toast.on{opacity:.94;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:12px;padding-block:12px 32px;border-top:1px solid var(--line)}
footer details{margin-top:8px} footer summary{cursor:pointer}
</style>
</head>
<body>

<header class="cover" id="cover">
  <img id="coverimg" alt="{{cover_alt}}">
  <div class="wrap">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{headline}}</h1>
    <p>카드를 누르면 자세히 볼 수 있어요. 중국어 이름은 누르면 복사돼요.</p>
  </div>
</header>

<nav class="tabs" id="tabsnav" aria-label="일차"><div class="wrap" role="tablist" id="tabs"></div></nav>
<div class="back" id="backbar" hidden><div class="wrap"><button type="button" id="backbtn">← 목록</button><span id="backtype"></span></div></div>

<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer><div class="wrap">
  {{footer}}
  <p class="offline" id="offline"></p>
  <details><summary>사진 출처 (Wikimedia Commons)</summary><ul id="credits"></ul></details>
</div></footer>

<script>
/*DATA*/
const TRIP = /*TRIP*/;
const IMG = /*IMAGES*/;
const CREDITS = /*CREDITS*/;
const PRON = /*PRON*/;
</script>
<script>
const SPOT_TOC = [["glance","한눈에"],["about","어떤 곳인가"],["story","가이드 이야기"],["see","꼭 볼 것·할 것"],["photo","사진 스팟"],["route","가는 법·동선"],["entry","입장·예약"],["warn","주의할 점"],["planb","플랜 B"],["src","출처"]];
const SHOP_TOC = [["glance","한눈에"],["about","어떤 집인가"],["menu","대표 메뉴·코스"],["order","우리 3명 추천 주문"],["pay","주문·결제"],["queue","웨이팅·자리 팁"],["warn","주의할 점"],["planb","플랜 B"],["src","출처"]];
const TYPE = {spot:"명소", shop:"가게"};
const BADGE = {ok:["확정","b-ok"],pay:["예매 필요","b-pay"],open:["오픈 대기","b-pay"],wait:["현장 웨이팅","b-wait"],line:["원격 줄서기","b-wait"],free:["무료","b-walk"],opt:["선택","b-walk"],cand:["후보","b-walk"],local:["현지 섭외","b-wait"]};
const MOVE = {walk:["🚶","도보"],didi:["🚕","디디"],metro:["🚇","지하철"],mall:["🏬","몰 안 이동"],cable:["🚡","케이블카"]};
const AMAP = q => TRIP.map_search + encodeURIComponent(q);

/* ───── 중국어 발음(한글) · 듣기 ───── */
const HAN = /[\u3400-\u9fff]+/g;
const HAS_HAN = /[\u3400-\u9fff]/;
const HANGUL = /[가-힣]/;
/* 한자 덩어리는 PRON 표의 한글로, 괄호는 남기고 나머지 기호는 뺀다. 한자가 없으면 "" */
const yin = s => !HAS_HAN.test(s) ? "" : String(s)
  .replace(HAN, m => " " + (PRON[m] ? PRON[m].h : "") + " ")
  .replace(/[（]/g, "(").replace(/[）]/g, ")")
  .replace(/[^가-힣0-9A-Za-z() ]/g, " ")
  .replace(/\(\s*/g, "(").replace(/\s*\)/g, ")").replace(/\(\)/g, "")
  .replace(/\s+/g, " ").trim();
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = zh => `<button type="button" class="say" data-say="${esc(zh)}" aria-label="중국어로 듣기">${SPK}</button>`;
/* 따옴표 안 설명 괄호(한글) 는 읽지 않는다: ‘微辣(웨이라)’ → 微辣 */
const sayText = s => s.replace(/[(（][^)）]*[가-힣][^)）]*[)）]/g, "").trim();
const squash = s => s.replace(/[\s()（）]/g, "");

/* 렌더가 끝난 화면에 발음·듣기 버튼을 붙인다
   ① 복사 버튼(.cc) 의 중국어 아래 한글 발음 + 옆에 듣기 버튼
   ② 본문 ‘中文’ 따옴표 → 누르면 읽어 주고, 뒤에 한글 발음 (이미 괄호로 발음이 적혀 있으면 생략) */
function annotateZh(root){
  if (!root) return;
  root.querySelectorAll(".cc[data-copy]").forEach(b => {
    const zh = b.dataset.copy; const t = b.querySelector(".zht");
    if (!t || !HAS_HAN.test(zh) || t.querySelector(".yin")) return;
    const r = yin(zh);
    t.innerHTML = `<span class="zh">${esc(t.textContent)}</span>` + (r ? `<span class="yin">${esc(r)}</span>` : "");
    if (!(b.nextElementSibling && b.nextElementSibling.classList.contains("say"))) b.insertAdjacentHTML("afterend", sayBtn(zh));
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentElement.closest(".cc,.phrase,button,a,script,style,textarea,.zhq,.yinq") ? NodeFilter.FILTER_REJECT
      : /‘[\u3400-\u9fff][^’]*’/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const html = esc(n.nodeValue).replace(/‘([\u3400-\u9fff][^’]*)’/g, (all, inner) => {
      const raw = inner.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
      const zh = sayText(raw); const r = yin(zh);
      const paren = (raw.match(/[(（]([^)）]*[가-힣][^)）]*)[)）]/) || [])[1];
      const show = r && !(paren && squash(paren) === squash(r));
      return `‘<button type="button" class="zhq" data-say="${esc(zh)}" aria-label="${esc(zh)} 듣기">${inner}${SPK}</button>’` + (show ? `<span class="yinq">${esc(r)}</span>` : "");
    });
    const span = document.createElement("span"); span.innerHTML = html;
    n.replaceWith(...span.childNodes);
  });
}

/* 듣기: 브라우저 내장 음성(Web Speech). 소리 파일 없음 → 오프라인에서도 기기 음성으로 */
let zhVoice = null, sayHinted = false;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang) && !/HK|TW|yue/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (e) { speechSynthesis.onvoiceschanged = pickVoice; } }
function say(text, el){
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") { toast("이 앱에선 소리가 안 나와요. 사파리·크롬으로 열어 주세요"); return; }
  const was = el.classList.contains("on");
  speechSynthesis.cancel();
  document.querySelectorAll(".say.on,.zhq.on").forEach(x => x.classList.remove("on"));
  if (was) return;  // 읽는 중에 다시 누르면 멈춤
  if (!zhVoice) pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 0.8; if (zhVoice) u.voice = zhVoice;
  u.onend = u.onerror = () => el.classList.remove("on");
  el.classList.add("on");
  speechSynthesis.speak(u);
  const vs = speechSynthesis.getVoices();
  if (vs.length && !zhVoice) toast("중국어 음성이 없어요. 설정 › 손쉬운 사용 › 읽기 및 말하기 › 음성에서 중국어 추가");
  else if (!sayHinted) { sayHinted = true; toast("소리가 안 나면 무음 모드를 꺼 주세요"); }
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ul = a => "<ul>" + a.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
const badge = k => k ? `<span class="badge ${BADGE[k][1]}">${BADGE[k][0]}</span>` : "";
const imgSrc = k => k && IMG[k] ? IMG[k] : null;
const glyph = p => (p.cn.match(/[一-鿿]/) || ["·"])[0];

/* 중국어 이름 복사 버튼. exact = 복사되는 글자 그대로 넣기 */
const copyBtn = (text, cls = "") => `<button type="button" class="cc ${cls}" data-copy="${esc(text)}" aria-label="${esc(text)} 복사"><span class="zht">${esc(text)}</span><span class="ccl">복사</span></button>`;

/* ───── 일차 목록 ───── */
function cardHTML(id){
  const p = PLACES[id]; const src = imgSrc(p.img);
  const th = src ? `<img class="thumb" src="${src}" alt="" loading="lazy">` : `<div class="glyph">${glyph(p)}</div>`;
  return `<div class="cardwrap"><button type="button" class="card ${p.type}" data-open="${id}">${th}
    <div class="cbody"><div class="crow"><span class="time">${esc(p.t)}</span><span class="tchip ${p.type}">${TYPE[p.type]}</span>${badge(p.badge)}</div>
    <h3>${esc(p.name)}</h3><p class="one">${esc(p.one)}</p></div><span class="chev" aria-hidden="true">›</span></button>
    <div class="cnrow"><span class="cnlab">中文</span>${copyBtn(p.cn)}</div></div>`;
}
function metroStepsHTML(steps){
  return `<details class="msteps"><summary>▸ 단계별로 보기 (${steps.length}단계)</summary><ol>${steps.map(x => `<li>${x}</li>`).join("")}</ol>
<button type="button" class="linkbtn" data-goto="metro">처음 타면: 지하철 타는 법 전체 보기 →</button></details>`;
}
function metroPanelHTML(){
  const kv = METRO.fare.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  return `<section class="panel" id="metro"><h3>🚇 지하철 타는 법</h3>
<p class="muted-s">한국에서 미리 준비 (5분)</p><ol class="prep">${METRO.prep.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ol>
<p class="muted-s" style="margin-top:14px">역에서 순서대로</p><ol class="stepper">${METRO.steps.map(([ic, t, d]) => `<li><div class="sico" aria-hidden="true">${ic}</div><div><b>${t}</b><span>${d}</span></div></li>`).join("")}</ol>
<dl class="kv" style="margin-top:4px">${kv}</dl>
<h4>QR이 안 될 때: 1회용 표 사기</h4><ul>${METRO.ticket.map(x => `<li>${x}</li>`).join("")}</ul>
<h4>주의</h4><ul class="warnlist">${METRO.warn.map(x => `<li>${x}</li>`).join("")}</ul></section>`;
}
function moveHTML(m){
  const [ic, label] = MOVE[m.move];
  return `<div class="move"><span class="mico" aria-hidden="true">${ic}</span><div class="mtxt"><b>${label} ${esc(m.min)}</b>${m.cost ? ` <span class="cost">· ${esc(m.cost)}</span>` : ""}${m.note ? `<small>${esc(m.note)}</small>` : ""}${m.steps ? metroStepsHTML(m.steps) : ""}</div></div>`;
}
function dayHTML(d){
  const n = d.flow.filter(x => x.stop); const spots = n.filter(x => PLACES[x.stop].type === "spot").length;
  const rows = d.flow.map(x => x.stop ? cardHTML(x.stop) : x.move ? moveHTML(x) : x.branch
    ? `<div class="branch"><b>${esc(x.branch)}</b>${esc(x.note)}</div>`
    : `<div class="minor"><span class="dot"></span><div><span class="time">${esc(x.t)}</span>${esc(x.name)}${x.note ? ` <small>· ${esc(x.note)}</small>` : ""}</div></div>`).join("");
  return `<div class="daylead"><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p>
    <div class="legend"><span><span class="tchip spot">명소</span> ${spots}곳</span><span><span class="tchip shop">가게</span> ${n.length - spots}곳</span><span>🚶 도보 🚕 디디 🚇 지하철</span></div></div>${rows}`;
}

/* ───── 장소 상세 ───── */
const spiceHTML = n => n === 0 ? `<span class="spice"><em>안 매움</em></span>`
  : `<span class="spice" aria-label="맵기 ${n}단계">${"🌶".repeat(n)}<span class="off">${"🌶".repeat(3 - n)}</span></span>`;
const SECTION = {
  glance: p => `<dl class="kv"><dt>우리 일정</dt><dd>${esc(p.t)} · ${esc(p.stay)}</dd>${p.glance.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`,
  about: p => typeof p.about === "string" ? `<p>${esc(p.about)}</p>`
    : `<p>${esc(p.about.text)}</p><div class="pc"><div class="pro"><b>좋다는 점</b>${ul(p.about.pros)}</div><div class="con"><b>아쉽다는 점</b>${ul(p.about.cons)}</div></div>`,
  menu: p => p.menu.map(([ko, zh, price, sp, desc]) => `<div class="dish"><div class="dish-h"><b>${esc(ko)}</b>${price ? `<span class="price">${esc(price)}</span>` : ""}</div>
      <div class="dish-m">${copyBtn(zh, "big")}${spiceHTML(sp)}</div><p>${esc(desc)}</p></div>`).join(""),
  order: p => `<ul class="order">${p.order.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="total">${esc(p.order.total)}</div>${p.order.note ? `<div class="note">${esc(p.order.note)}</div>` : ""}`,
  story: p => `<div class="stories">${p.story.map(([t, d]) => `<div class="story"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join("")}</div>`,
  src: p => `<ul class="src">${p.src.map(([n, u]) => u ? `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a></li>` : `<li>${esc(n)}</li>`).join("")}${p.img && CREDITS[p.img] ? `<li>사진: ${esc(CREDITS[p.img].artist)} · ${esc(CREDITS[p.img].license)} (Wikimedia Commons)</li>` : ""}</ul>`
};
const listSection = key => p => ul(p[key]);

/* ───── 기념품·쇼핑 탭 (대상별 태그 필터) ───── */
const TAGS = (typeof SHOPPING !== "undefined" && SHOPPING && SHOPPING.tags) || {work:"회사용", friend:"지인용", family:"가족용"};
let giftTag = "all";
const giftHTML = g => `<article class="gift" data-tags="${esc((g.tags || []).join(" "))}">
  <div class="gtop"><h4>${esc(g.name)}</h4><div class="gprice">${esc(g.price)}<span>약 ${esc(g.krw)}</span></div></div>
  <div class="gtags">${(g.tags || []).map(t => `<span class="gtag ${esc(t)}">${esc(TAGS[t] || t)}</span>`).join("")}</div>
  <div class="dish-m">${copyBtn(g.cn, "big")}</div>
  <p>${esc(g.why)}</p>
  ${g.where ? `<p class="gmeta"><b>어디서</b> ${esc(g.where)}</p>` : ""}
  ${g.note ? `<p class="gmeta">${g.warn ? `<span class="gwarn">⚠ ${esc(g.note)}</span>` : esc(g.note)}</p>` : ""}</article>`;
const storeHTML = s => `<article class="store"><h4>${esc(s.name)}<span class="sk">${esc(s.kind)}</span></h4>
  <div class="addr">${esc(s.addr)}</div>
  <div class="cn">${copyBtn(s.cn)}<a href="${AMAP(s.cn)}" target="_blank" rel="noopener">${esc(TRIP.map_label)} ↗</a>${s.goto ? `<button type="button" class="linkbtn" data-open="${esc(s.goto)}">${esc(s.gotoLabel || "가이드에서 보기")} →</button>` : ""}</div>
  <p>${esc(s.why)}</p>
  ${s.best ? `<p class="gmeta"><b>여기서 살 것</b> ${esc(s.best)}</p>` : ""}</article>`;
function shoppingHTML(){
  const f = SHOPPING.filters || [["all","전체"],["work","회사용"],["friend","지인용"],["family","가족용"]];
  const tips = (SHOPPING.tips || []).map(t => `<li>${esc(t)}</li>`).join("");
  const carry = (SHOPPING.carry || []).map(t => `<li>${esc(t)}</li>`).join("");
  const src = (SHOPPING.src || []).map(([n, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join("");
  return `<div class="daylead"><h2>${esc(SHOPPING.title || "기념품·쇼핑")}</h2><p>${esc(SHOPPING.lead || "")}</p></div>
    ${SHOPPING.warn ? `<p class="callout">${esc(SHOPPING.warn)}</p>` : ""}
    <section class="panel"><h3>누구에게 줄까 <small style="color:var(--muted);font-weight:400">눌러서 거르기</small></h3>

/* ───── 카페·가게 탭 (구역 + 성격 두 줄 필터) ───── */

let cafeArea = "all", cafeTag = "all";
const cafeCard = s => `<article class="ccard" data-area="${esc(s.area)}" data-tags="${esc((s.tags || []).join(" "))}">

    <dt>가격</dt><dd>${esc(s.price)}${s.krw ? ` <span>(${esc(s.krw)})</span>` : ""}</dd>
    <dt>영업</dt><dd>${esc(s.hours)}</dd><dt>위치</dt><dd>${esc(s.where)}</dd></dl>
  <div class="cmenu">${(s.menu || []).map(m => `<span>${esc(m[0])}${m[1] ? ` <b>${esc(m[1])}</b>` : ""}</span>`).join("")}</div>

function applyCafeFilter(){
  const box = $("cafelist"); if (!box) return;
  let n = 0;
  for (const el of box.querySelectorAll("[data-area]")) {
    const on = (cafeArea === "all" || el.dataset.area === cafeArea) && (cafeTag === "all" || el.dataset.tags.split(" ").includes(cafeTag));

  for (const b of document.querySelectorAll("#cafeareas [data-af]")) b.setAttribute("aria-pressed", b.dataset.af === cafeArea ? "true" : "false");

}

/* 현지에서 쓸 말: 공통 탭 문장과 같은 모양 (중국어 · 한글 발음 · 뜻 · 듣기 · 복사) */
const phraseHTML = ([ko, zh]) => `<div class="phrase"><div class="pt"><span class="zhb">${esc(zh)}</span><span class="yin">${esc(yin(zh))}</span><span class="ko">${esc(ko)}</span></div><div class="pb">${sayBtn(zh)}<button type="button" data-copy="${esc(zh)}">복사</button></div></div>`;
const talkHTML = list => `<p class="talkhint">🔊 누르면 중국어로 읽어 줘요. 화면을 보여 줘도 돼요.</p>${list.map(phraseHTML).join("")}`;

function detailHTML(id){
  const p = PLACES[id]; const base = p.type === "spot" ? SPOT_TOC : SHOP_TOC;
  const talk = typeof TALK !== "undefined" && TALK[id] && TALK[id].length ? TALK[id] : null;
  const toc = talk ? [base[0], ["talk", "현지에서 쓸 말"], ...base.slice(1)] : base;
  const day = DAYS.find(d => d.id === p.day); const stops = day.flow.filter(x => x.stop).map(x => x.stop);
  const i = stops.indexOf(id); const prev = stops[i - 1], next = stops[i + 1];
  const src = imgSrc(p.img);
  const hero = src ? `<figure class="dhero"><img src="${src}" alt="${esc(p.name)}">${CREDITS[p.img] ? `<figcaption>${p.img === "nanan" ? "남안구 강변 · " : ""}${esc(CREDITS[p.img].artist)} · ${esc(CREDITS[p.img].license)}</figcaption>` : ""}</figure>` : "";
  const secs = toc.map(([k, label], n) => `<section class="dsec${k === "warn" ? " warn" : ""}" id="sec-${k}"><h3><b>${String(n + 1).padStart(2, "0")}</b>${label}</h3>${(k === "talk" ? talkHTML(talk) : (SECTION[k] || listSection(k))(p))}</section>`).join("");
  const pg = (pid, cls, dir) => pid ? `<button type="button" class="${cls}" data-open="${pid}"><span>${dir}</span>${esc(PLACES[pid].name)}</button>` : "<span></span>";
  return `${hero}<div class="dhead"><div class="crow"><span class="tchip ${p.type}">${TYPE[p.type]}</span>${badge(p.badge)}<span class="time">${esc(day.tab)} · ${esc(p.t)}</span></div>
    <h2>${esc(p.name)}</h2><p class="one">${esc(p.one)}</p>
    <div class="cn">${copyBtn(p.cn, "big")}<a href="${AMAP(p.cn)}" target="_blank" rel="noopener">${esc(TRIP.map_label)} ↗</a></div></div>
    <nav class="toc" aria-label="목차">${toc.map(([k, label], n) => `<button type="button" data-jump="sec-${k}"><b>${n + 1}</b>${label}</button>`).join("")}</nav>
    ${secs}<div class="pager">${pg(prev, "prev", "← 이전")}${pg(next, "next", "다음 →")}</div>`;
}

/* ───── 라우팅 ───── */
const HAS_STORY = typeof STORY !== "undefined" && STORY && STORY.html;
const HAS_ARRIVAL = typeof ARRIVAL !== "undefined" && ARRIVAL && ARRIVAL.html;
const HAS_SHOPPING = typeof SHOPPING !== "undefined" && SHOPPING && SHOPPING.gifts && SHOPPING.gifts.length;
const TABS = [...(HAS_ARRIVAL ? [{id:"arrival", label:ARRIVAL.label || "입국카드", small:ARRIVAL.small || "출국 전"}] : []),
  ...DAYS.map(d => ({id:d.id, label:d.tab, small:d.date})), {id:"common", label:"공통", small:"결제·말·긴급"},
  ...(HAS_SHOPPING ? [{id:"shopping", label:SHOPPING.label || "기념품", small:SHOPPING.small || "쇼핑"}] : []),
  ...(HAS_CAFES ? [{id:"cafes", label:CAFES.label || "카페·가게", small:CAFES.small || "동선별"}] : []),
  ...(HAS_STORY ? [{id:"story", label:STORY.label || "여행 이야기", small:STORY.small || "역사·상식"}] : [])];
const $ = id => document.getElementById(id);
let lastDay = "d1";

function selectTab(tab){
  for (const b of [...$("tabs").children]) b.setAttribute("aria-selected", b.dataset.id === tab ? "true" : "false");
  const a = [...$("tabs").children].find(b => b.dataset.id === tab);
  if (a && a.scrollIntoView) { try { a.scrollIntoView({inline:"center", block:"nearest"}); } catch (e) {} }
}
let pendingJump = null;
function render(){ renderView(); annotateZh($("view")); }
function renderView(){
  const h = location.hash.slice(1);
  const place = h.startsWith("p-") && PLACES[h.slice(2)] ? h.slice(2) : null;
  const tab = place ? null : (TABS.some(t => t.id === h) ? h : initialTab());
  $("cover").hidden = !!place; $("tabsnav").hidden = !!place; $("backbar").hidden = !place;
  if (place) {
    const p = PLACES[place]; lastDay = p.day;
    $("backbtn").textContent = "← " + DAYS.find(d => d.id === p.day).tab + " 목록";
    $("backtype").textContent = TYPE[p.type] + " 상세";
    $("view").innerHTML = detailHTML(place);
    window.scrollTo(0, 0);
    return;
  }
  if (tab === "arrival" && HAS_ARRIVAL) {
    $("view").innerHTML = ARRIVAL.html;
    selectTab(tab);
    try { localStorage.setItem(TRIP.slug + "-tab", tab); } catch (e) {}
    window.scrollTo(0, 0);
    return;
  }
  if (tab === "shopping" && HAS_SHOPPING) {
    $("view").innerHTML = shoppingHTML();
    applyGiftFilter();
    selectTab(tab);
    try { localStorage.setItem(TRIP.slug + "-tab", tab); } catch (e) {}
    window.scrollTo(0, 0);
    return;
  }
  if (tab === "cafes" && HAS_CAFES) {
    $("view").innerHTML = cafesHTML();
    applyCafeFilter();
    selectTab(tab);
    try { localStorage.setItem(TRIP.slug + "-tab", tab); } catch (e) {}
    window.scrollTo(0, 0);
    return;
  }
  if (tab === "common") {
    $("view").innerHTML = COMMON;
    if ($("metroslot") && typeof METRO !== "undefined") $("metroslot").innerHTML = metroPanelHTML();
    if (pendingJump) { const id = pendingJump; pendingJump = null; requestAnimationFrame(() => $(id)?.scrollIntoView({block:"start"})); }
    if ($("phrases") && typeof PHRASES !== "undefined") $("phrases").innerHTML = PHRASES.map(phraseHTML).join("");
  } else if (tab === "story" && HAS_STORY) {
    $("view").innerHTML = STORY.html;
    selectTab(tab);
    try { localStorage.setItem(TRIP.slug + "-tab", tab); } catch (e) {}
    return;
  } else {
    lastDay = tab; $("view").innerHTML = dayHTML(DAYS.find(d => d.id === tab));
  }
  selectTab(tab);
  try { localStorage.setItem(TRIP.slug + "-tab", tab); } catch (e) {}
}
function initialTab(){
  const today = new Intl.DateTimeFormat("en-CA", {timeZone:TRIP.tz}).format(new Date());
  const d = DAYS.find(x => x.iso === today); if (d) return d.id;
  try { const s = localStorage.getItem(TRIP.slug + "-tab"); if (TABS.some(t => t.id === s)) return s; } catch (e) {}
  return "d1";
}

$("tabs").innerHTML = TABS.map(t => `<button type="button" role="tab" data-id="${t.id}">${t.label}<small>${t.small}</small></button>`).join("");
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.id; });
$("backbtn").addEventListener("click", () => { location.hash = lastDay; });

/* 복사: navigator.clipboard → 안 되면 textarea+execCommand (모바일·구형 사전 둘 다) */
async function copyText(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.setAttribute("aria-hidden", "true");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  let ok = false;
  try { ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
let toastTimer;
function toast(msg){
  const t = $("toast"); if (!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1500);
}
function copyDone(el, ok){
  const lab = el.querySelector(".ccl");
  el.classList.toggle("copied", ok);
  if (!ok) {  // 복사가 막힌 브라우저: 이름만 골라 두어 길게 눌러 복사할 수 있게
    try {
      const r = document.createRange(); r.selectNodeContents(el.querySelector(".zh") || el.querySelector(".zht") || el);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
  }
  if (lab) { if (!lab.dataset.old) lab.dataset.old = lab.textContent; lab.textContent = ok ? "복사됨" : "길게 눌러 복사"; }
  else { if (!el.dataset.old) el.dataset.old = el.textContent; el.textContent = ok ? "복사됨 ✓" : "길게 눌러 복사"; }
  toast(ok ? "복사했어요 ✓" : "복사가 막혔어요. 길게 눌러 복사해 주세요");
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.classList.remove("copied");
    if (lab) lab.textContent = lab.dataset.old || "복사";
    else el.textContent = el.dataset.old || "복사";
  }, 1600);
}
document.addEventListener("click", async e => {
  const af = e.target.closest("[data-af]"); if (af) { cafeArea = af.dataset.af; applyCafeFilter(); return; }
  const tf = e.target.closest("[data-tf]"); if (tf) { cafeTag = tf.dataset.tf; applyCafeFilter(); return; }
  const filt = e.target.closest("[data-filter]"); if (filt) { giftTag = filt.dataset.filter; applyGiftFilter(); return; }
  const sy = e.target.closest("[data-say]"); if (sy) { e.preventDefault(); say(sy.dataset.say, sy); return; }
  const c = e.target.closest("[data-copy]");
  if (c) { e.preventDefault(); copyDone(c, await copyText(c.dataset.copy)); return; }
  const open = e.target.closest("[data-open]"); if (open) { location.hash = "p-" + open.dataset.open; return; }
  const go = e.target.closest("[data-goto]"); if (go) { pendingJump = go.dataset.goto; if (location.hash === "#common") render(); else location.hash = "common"; return; }
  const goto = e.target.closest("[data-goto-tab]"); if (goto) { location.hash = goto.dataset.gotoTab; return; }
  const jump = e.target.closest("[data-jump]"); if (jump) { $(jump.dataset.jump)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
});
window.addEventListener("hashchange", render);
$("coverimg").src = IMG.hero || "";
$("credits").innerHTML = Object.entries(CREDITS).map(([k, c]) => `<li><a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.title.replace("File:", ""))}</a> · ${esc(c.artist)} · ${esc(c.license)}</li>`).join("");
render();

/* 오프라인: 서비스 워커가 페이지를 저장해 둔다 (https 에서만). 홈 화면 앱이면 비행기 모드에서도 열린다 */
(function offline(){
  const el = $("offline"); if (!el) return;
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (!("serviceWorker" in navigator) || !window.isSecureContext) {
    el.textContent = "오프라인 저장은 아이폰 사파리에서 돼요: 링크를 사파리로 열고 공유 › 홈 화면에 추가.";
    return;
  }
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
    el.innerHTML = standalone
      ? "<b>✓ 오프라인 저장됨</b> · 인터넷이 될 때 열면 다음부터 새 버전으로 바뀌어요."
      : "<b>✓ 오프라인 저장됨</b> · 비행기 모드에서도 쓰려면 사파리 공유 › <b>홈 화면에 추가</b> 후 그 아이콘으로 여세요.";
  }).catch(() => { el.textContent = "오프라인 저장에 실패했어요. 인터넷이 될 때 다시 열어 주세요."; });
})();
